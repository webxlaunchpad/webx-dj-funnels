name: End-to-end (test)
# Runs the full purchase check against the TEST funnels only. Push to e2e-test to run.
on:
  push:
    branches: [e2e-test]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: checkout-screenshot, path: e2e-checkout.png }
